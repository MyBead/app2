name: Probe shop pages

# Live check: runs the app's loading code against the real sites whenever parsing code changes
# (and, with --pages, dumps page structure for adapting parsers).
on:
  push:
    paths: ['scripts/probe-sources.ts', 'src/core/**', 'src/providers/**', '.github/workflows/probe-sources.yml']
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores to probe (space separated, empty = all)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lidl sends very large headers; Node's default limit rejects them.
      - run: NODE_OPTIONS=--max-http-header-size=262144 npx tsx scripts/probe-sources.ts ${{ github.event.inputs.stores || 'biedronka zabka kaufland lidl' }}
